receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:4317
      http:
        endpoint: 127.0.0.1:4318
processors:
  attributes/allowlist:
    actions:
      - key: prompt
        action: delete
      - key: body
        action: delete
      - key: content
        action: delete
      - key: model.output
        action: delete
      - key: tool.arguments
        action: delete
  batch: {}
exporters:
  debug:
    verbosity: basic
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [attributes/allowlist, batch]
      exporters: [debug]
