name: Stage 4 offline checks
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit and integration tests
        run: python3 -m unittest discover -s tests -v
      - name: Synthetic eval regression
        run: python3 stage4.py eval --check-baseline
