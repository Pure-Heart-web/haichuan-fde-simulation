name: FDE Stage 1–15 offline checks
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit and integration tests
        run: python3 -m unittest discover -s tests -v
      - name: Stage 4 synthetic extraction regression
        run: python3 stage4.py eval --check-baseline
      - name: Stage 6 synthetic context, knowledge, and draft regression
        run: python3 stage6.py eval --check-baseline
      - name: Stage 7 synthetic pilot and incident regression
        run: python3 stage7.py eval --check-baseline
      - name: Stage 8 synthetic two-tenant and safety regression
        run: python3 stage8.py eval --check-baseline
      - name: Two-domain vertical workflow regression
        run: python3 stage8_vertical.py demo --check-baseline
      - name: Stage 9 synthetic delivery hardening regression
        run: python3 stage9.py demo --check-baseline
      - name: Stage 10 synthetic customer onboarding and shadow regression
        run: python3 stage10.py demo --check-baseline
      - name: Stage 11 production-shaped delivery room regression
        run: python3 stage11.py demo --check-baseline
      - name: Stage 12 model evaluation, safety, canary, and rollback regression
        run: python3 stage12.py demo --check-baseline
      - name: Stage 13 design-partner pilot readiness and workbench regression
        run: python3 stage13.py demo --check-baseline
      - name: Stage 14 integration lab and authorized shadow preflight regression
        run: python3 stage14.py demo --check-baseline
      - name: Stage 15 commercial delivery room regression
        run: python3 stage15.py demo --check-baseline
      - name: Stage 1–15 offline delivery walkthrough
        run: python3 stage_pipeline.py all
