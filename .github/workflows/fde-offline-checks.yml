name: FDE Stage 1–7 offline checks
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit and integration tests
        run: python3 -m unittest discover -s tests -v
      - name: Stage 4 synthetic extraction regression
        run: python3 stage4.py eval --check-baseline
      - name: Stage 6 synthetic context, knowledge, and draft regression
        run: python3 stage6.py eval --check-baseline
      - name: Stage 7 synthetic pilot and incident regression
        run: python3 stage7.py eval --check-baseline
      - name: Stage 1–7 offline delivery walkthrough
        run: python3 stage_pipeline.py all
